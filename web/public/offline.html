<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TUGON | Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #0f172a; }
    main { max-width: 360px; padding: 24px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 8px; color: #1e3a8a; }
    p { font-size: 14px; line-height: 1.5; color: #64748b; }
    a { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 12px; background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; }
    .call { background: #dc2626; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="TUGON">
    <h1>You are offline</h1>
    <p>TUGON needs a connection to load incidents. Check your signal, then try again.</p>
    <p>In an emergency, call 911 now. A phone call works without internet.</p>
    <a href="/dashboard">Try again</a>
    <a class="call" href="tel:911">Call 911</a>
  </main>
</body>
</html>
