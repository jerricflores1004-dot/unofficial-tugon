  name: TUGON
  description: Resident incident reporting for MDRRMO Mabini.
  publish_to: 'none'
  version: 1.0.0+1
  environment:
    sdk: '>=3.3.0 <4.0.0'
  dependencies:
    flutter:
      sdk: flutter
    flutter_riverpod: ^2.5.1
    dio: ^5.7.0
    image_picker: ^1.1.2
    firebase_core: ^3.8.0
    firebase_messaging: ^15.1.5
    supabase_flutter: ^2.8.0
    go_router: ^14.6.1
    cached_network_image: ^3.4.1
    flutter_dotenv: ^5.2.0
    connectivity_plus: ^6.1.0
    uuid: ^4.5.1
    shared_preferences: ^2.3.3
    geolocator: ^14.1.2
    url_launcher: ^6.3.3
  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^5.0.0
    flutter_launcher_icons: ^0.14.3
  flutter:
    uses-material-design: true
    assets:
      - .env
  flutter_launcher_icons:
      android: "launcher_icon"
      image_path: "assets/icon/icon.jpg"
      min_sdk_android: 21